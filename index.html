<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BITCOIN BANK - Digital Asset Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body { background-color: #0a0e17; color: #f8fafc; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currency, setCurrency] = useState('PHP');
      const [activeTab, setActiveTab] = useState('home');
      const [searchTerm, setSearchTerm] = useState('');
      const [hideBalance, setHideBalance] = useState(false);

      // Exchange rate conversion approx: 1 USD = 56 PHP
      const rate = 56.0;
      const formatMoney = (phpAmount) => {
        if (hideBalance) return "••••••••";
        if (currency === 'USD') {
          return '$' + (phpAmount / rate).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        return '₱' + phpAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

      // Crypto Market Data Mock / Real-time simulation
      const cryptoData = [
        { name: 'Bitcoin', symbol: 'BTC', pricePHP: 3850000, change: +4.25, icon: '₿' },
        { name: 'Ethereum', symbol: 'ETH', pricePHP: 215000, change: +2.10, icon: 'Ξ' },
        { name: 'XRP', symbol: 'XRP', pricePHP: 32.50, change: -1.15, icon: '✕' },
        { name: 'Solana', symbol: 'SOL', pricePHP: 8900, change: +6.80, icon: '◎' },
        { name: 'Tether', symbol: 'USDT', pricePHP: 56.10, change: +0.02, icon: '₮' },
        { name: 'Dogecoin', symbol: 'DOGE', pricePHP: 8.40, change: -2.40, icon: 'Ð' },
        { name: 'Binance Coin', symbol: 'BNB', pricePHP: 34200, change: +1.55, icon: 'BNB' },
        { name: 'Cardano', symbol: 'ADA', pricePHP: 24.80, change: +3.12, icon: '₳' },
      ];

      // Exact Mama Account Deposits (Total: ₱138,472.00)
      const mamaDeposits = [
        { id: 'TX-88310', date: 'August 14, 2026', desc: 'Scheduled Monthly Deposit', amount: 10000.00, status: 'Completed' },
        { id: 'TX-77291', date: 'May 02, 2026', desc: 'Quarterly Allocation Deposit', amount: 40000.00, status: 'Completed' },
        { id: 'TX-65420', date: 'November 18, 2025', desc: 'Mid-term Capital Addition', amount: 25000.00, status: 'Completed' },
        { id: 'TX-52194', date: 'June 10, 2025', desc: 'Secondary Account Funding', amount: 23472.00, status: 'Completed' },
        { id: 'TX-41002', date: 'January 15, 2025', desc: 'Initial Vault Initialization', amount: 40000.00, status: 'Completed' },
      ];

      // Exact My Account Deposits (Total: ₱119,034.00)
      const myDeposits = [
        { id: 'TX-99210', date: 'September 05, 2026', desc: 'Monthly Savings Allocation', amount: 19034.00, status: 'Completed' },
        { id: 'TX-81204', date: 'April 20, 2026', desc: 'Spring Asset Deposit', amount: 20000.00, status: 'Completed' },
        { id: 'TX-70331', date: 'August 12, 2025', desc: 'Bonus Yield Compounding', amount: 15000.00, status: 'Completed' },
        { id: 'TX-62109', date: 'March 05, 2025', desc: 'Secondary Wallet Transfer', amount: 14000.00, status: 'Completed' },
        { id: 'TX-50112', date: 'November 10, 2024', desc: 'Primary Vault Opening Deposit', amount: 50000.00, status: 'Completed' },
      ];

      return (
        <div className="min-h-screen bg-[#0A0E17] text-slate-100 p-4 md:p-8">
          {/* Top Bar Header */}
          <header className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-4 gap-4">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('home')}>
              <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/20">
                ₿
              </div>
              <div>
                <h1 className="text-xl font-black tracking-wider text-amber-400">BITCOIN BANK</h1>
                <p className="text-xs text-slate-400">Digital Asset & Time Deposit Platform</p>
              </div>
            </div>
            
            <div className="flex items-center space-x-4">
              <button 
                onClick={() => setHideBalance(!hideBalance)}
                className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                {hideBalance ? '👁️ Show Balances' : '🔒 Hide Balances'}
              </button>
              <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button 
                  onClick={() => setCurrency('PHP')} 
                  className={`px-3 py-1 rounded-lg text-xs font-bold transition ${currency === 'PHP' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>
                  PHP (₱)
                </button>
                <button 
                  onClick={() => setCurrency('USD')} 
                  className={`px-3 py-1 rounded-lg text-xs font-bold transition ${currency === 'USD' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>
                  USD ($)
                </button>
              </div>
            </div>
          </header>

          {/* Navigation Bar */}
          <nav className="flex space-x-2 mb-8 bg-slate-900/90 p-2 rounded-xl border border-slate-800 overflow-x-auto">
            {[
              { id: 'home', label: 'Home Dashboard' },
              { id: 'time-deposit', label: 'Time Deposit Hub' },
              { id: 'market', label: 'Crypto Market' },
              { id: 'faq', label: 'Help Center / FAQ' }
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all ${
                  activeTab === tab.id ? 'bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/20' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                }`}>
                {tab.label}
              </button>
            ))}
          </nav>

          {/* PAGE 1: HOME DASHBOARD */}
          {activeTab === 'home' && (
            <div className="space-y-8">
              {/* Account Overview Cards */}
              <div>
                <h2 className="text-lg font-bold text-slate-300 mb-4 flex items-center gap-2">
                  <span>🏦</span> My Time Deposit Vaults (Maturity: June 30, 2030)
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Mama Account Card */}
                  <div 
                    onClick={() => setActiveTab('mama-detail')}
                    className="bg-gradient-to-br from-slate-900 to-[#121824] border border-slate-800 hover:border-amber-500/60 p-6 rounded-2xl cursor-pointer transition-all shadow-xl hover:-translate-y-1 group">
                    <div className="flex justify-between items-start mb-4">
                      <div>
                        <span className="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-full font-bold">ACTIVE TIME DEPOSIT</span>
                        <h3 className="text-xl font-bold text-white mt-2 group-hover:text-amber-400 transition">Mama Account</h3>
                      </div>
                      <span className="text-2xl">🔒</span>
                    </div>
                    <div className="text-3xl font-black text-amber-400 mb-2">
                      {formatMoney(138472.00)}
                    </div>
                    <div className="flex justify-between text-xs text-slate-400 border-t border-slate-800 pt-3 mt-3">
                      <span>Created: January 2025</span>
                      <span className="text-amber-400 font-bold flex items-center gap-1">View Ledger →</span>
                    </div>
                  </div>

                  {/* My Account Card */}
                  <div 
                    onClick={() => setActiveTab('my-detail')}
                    className="bg-gradient-to-br from-slate-900 to-[#121824] border border-slate-800 hover:border-amber-500/60 p-6 rounded-2xl cursor-pointer transition-all shadow-xl hover:-translate-y-1 group">
                    <div className="flex justify-between items-start mb-4">
                      <div>
                        <span className="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-full font-bold">ACTIVE TIME DEPOSIT</span>
                        <h3 className="text-xl font-bold text-white mt-2 group-hover:text-amber-400 transition">My Account</h3>
                      </div>
                      <span className="text-2xl">🔒</span>
                    </div>
                    <div className="text-3xl font-black text-amber-400 mb-2">
                      {formatMoney(119034.00)}
                    </div>
                    <div className="flex justify-between text-xs text-slate-400 border-t border-slate-800 pt-3 mt-3">
                      <span>Created: November 2024</span>
                      <span className="text-amber-400 font-bold flex items-center gap-1">View Ledger →</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Real-time Cryptocurrency Ticker Grid */}
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold text-slate-300 flex items-center gap-2">
                    <span>📈</span> Live Cryptocurrency Market Overview
                  </h2>
                  <button onClick={() => setActiveTab('market')} className="text-xs text-amber-400 hover:underline">View All Markets →</button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {cryptoData.slice(0, 4).map((coin, idx) => {
                    const displayPrice = currency === 'USD' ? coin.pricePHP / rate : coin.pricePHP;
                    return (
                      <div key={idx} className="bg-slate-900 border border-slate-800 p-4 rounded-xl hover:border-slate-700 transition">
                        <div className="flex justify-between items-center mb-2">
                          <span className="font-bold text-white flex items-center gap-2">
                            <span className="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs font-black">{coin.icon}</span>
                            {coin.name} <span className="text-xs text-slate-500">{coin.symbol}</span>
                          </span>
                          <span className={`text-xs font-bold px-2 py-0.5 rounded ${coin.change >= 0 ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'}`}>
                            {coin.change >= 0 ? '+' : ''}{coin.change}%
                          </span>
                        </div>
                        <div className="text-lg font-black text-amber-400">
                          {currency === 'USD' ? '$' : '₱'}{displayPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* PAGE 2: TIME DEPOSIT HUB */}
          {activeTab === 'time-deposit' && (
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-6">
              <div>
                <h2 className="text-2xl font-bold text-amber-400 mb-1">MY TIME DEPOSIT ACCOUNTS</h2>
                <p className="text-slate-400 text-sm">Review locked capital balances, official maturity dates, and complete verified 5-tier transaction histories.</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div onClick={() => setActiveTab('mama-detail')} className="bg-[#0A0E17] border border-slate-800 p-6 rounded-xl cursor-pointer hover:border-amber-500 transition">
                  <h3 className="text-lg font-bold text-white mb-2">Mama Account</h3>
                  <div className="text-2xl font-black text-amber-400 mb-2">{formatMoney(138472.00)}</div>
                  <p className="text-xs text-slate-400 mb-4">🔒 Withdraw on exactly June 30, 2030</p>
                  <span className="text-xs text-amber-400 font-bold">Open Full Ledger History (5 Deposits) →</span>
                </div>
                <div onClick={() => setActiveTab('my-detail')} className="bg-[#0A0E17] border border-slate-800 p-6 rounded-xl cursor-pointer hover:border-amber-500 transition">
                  <h3 className="text-lg font-bold text-white mb-2">My Account</h3>
                  <div className="text-2xl font-black text-amber-400 mb-2">{formatMoney(119034.00)}</div>
                  <p className="text-xs text-slate-400 mb-4">🔒 Withdraw on exactly June 30, 2030</p>
                  <span className="text-xs text-amber-400 font-bold">Open Full Ledger History (5 Deposits) →</span>
                </div>
              </div>
            </div>
          )}

          {/* PAGE 3: CRYPTO MARKET LIST */}
          {activeTab === 'market' && (
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-6">
              <h2 className="text-xl font-bold text-amber-400">Cryptocurrency Market Prices</h2>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400">
                      <th className="pb-3">Asset</th>
                      <th className="pb-3">Price ({currency})</th>
                      <th className="pb-3">24h Change</th>
                      <th className="pb-3">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {cryptoData.map((coin, idx) => {
                      const displayPrice = currency === 'USD' ? coin.pricePHP / rate : coin.pricePHP;
                      return (
                        <tr key={idx} className="hover:bg-slate-800/30">
                          <td className="py-3 font-bold text-white flex items-center gap-2">
                            <span className="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-black">{coin.icon}</span>
                            {coin.name} <span className="text-slate-500 text-xs">{coin.symbol}</span>
                          </td>
                          <td className="py-3 font-semibold text-amber-400">
                            {currency === 'USD' ? '$' : '₱'}{displayPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                          </td>
                          <td className="py-3">
                            <span className={`px-2 py-1 rounded text-xs font-bold ${coin.change >= 0 ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'}`}>
                              {coin.change >= 0 ? '+' : ''}{coin.change}%
                            </span>
                          </td>
                          <td className="py-3">
                            <button onClick={() => alert(`Redirecting to trade ${coin.symbol}`)} className="bg-amber-500 text-slate-950 px-3 py-1 rounded text-xs font-bold hover:bg-amber-400">Trade</button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* PAGE 4: MAMA ACCOUNT DETAILS */}
          {activeTab === 'mama-detail' && (
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-6">
              <button onClick={() => setActiveTab('home')} className="text-xs text-amber-400 hover:underline">← Back to Dashboard</button>
              
              <div className="border-b border-slate-800 pb-4">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full font-bold">ACTIVE TIME DEPOSIT</span>
                    <h2 className="text-2xl font-black text-white mt-2">Mama Account</h2>
                    <p className="text-xs text-slate-400">Account Type: Time Deposit Vault</p>
                  </div>
                  <div className="text-right">
                    <div className="text-3xl font-black text-amber-400">{formatMoney(138472.00)}</div>
                  </div>
                </div>
                <div className="mt-4 p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl flex items-center gap-3 text-amber-300 text-sm">
                  <span>🔒</span>
                  <span>"Time Deposit Account to be withdrawn on exactly June 30, 2030."</span>
                </div>
              </div>

              {/* Deposit History */}
              <div>
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-2">
                  <h3 className="font-bold text-white text-lg">DEPOSIT TRANSACTION HISTORY (Total: ₱138,472.00)</h3>
                  <input 
                    type="text" 
                    placeholder="Search transaction..." 
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs text-white focus:outline-none focus:border-amber-500"
                  />
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400 text-xs">
                        <th className="pb-2">Ref No.</th>
                        <th className="pb-2">Deposit Date</th>
                        <th className="pb-2">Description</th>
                        <th className="pb-2">Status</th>
                        <th className="pb-2 text-right">Amount</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {mamaDeposits
                        .filter(tx => tx.desc.toLowerCase().includes(searchTerm.toLowerCase()) || tx.id.toLowerCase().includes(searchTerm.toLowerCase()))
                        .map((tx, idx) => (
                        <tr key={idx} className="hover:bg-slate-800/30">
                          <td className="py-3 font-mono text-xs text-amber-400">{tx.id}</td>
                          <td className="py-3 text-slate-300 text-xs">{tx.date}</td>
                          <td className="py-3 text-slate-200">{tx.desc}</td>
                          <td className="py-3"><span className="text-xs bg-green-500/10 text-green-400 px-2 py-0.5 rounded font-bold">{tx.status}</span></td>
                          <td className="py-3 text-right font-bold text-green-400">+{formatMoney(tx.amount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* PAGE 5: MY ACCOUNT DETAILS */}
          {activeTab === 'my-detail' && (
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-6">
              <button onClick={() => setActiveTab('home')} className="text-xs text-amber-400 hover:underline">← Back to Dashboard</button>
              
              <div className="border-b border-slate-800 pb-4">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full font-bold">ACTIVE TIME DEPOSIT</span>
                    <h2 className="text-2xl font-black text-white mt-2">My Account</h2>
                    <p className="text-xs text-slate-400">Account Type: Time Deposit Vault</p>
                  </div>
                  <div className="text-right">
                    <div className="text-3xl font-black text-amber-400">{formatMoney(119034.00)}</div>
                  </div>
                </div>
                <div className="mt-4 p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl flex items-center gap-3 text-amber-300 text-sm">
                  <span>🔒</span>
                  <span>"Time Deposit Account to be withdrawn on exactly June 30, 2030."</span>
                </div>
              </div>

              {/* Deposit History */}
              <div>
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-2">
                  <h3 className="font-bold text-white text-lg">DEPOSIT TRANSACTION HISTORY (Total: ₱119,034.00)</h3>
                  <input 
                    type="text" 
                    placeholder="Search transaction..." 
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs text-white focus:outline-none focus:border-amber-500"
                  />
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400 text-xs">
                        <th className="pb-2">Ref No.</th>
                        <th className="pb-2">Deposit Date</th>
                        <th className="pb-2">Description</th>
                        <th className="pb-2">Status</th>
                        <th className="pb-2 text-right">Amount</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {myDeposits
                        .filter(tx => tx.desc.toLowerCase().includes(searchTerm.toLowerCase()) || tx.id.toLowerCase().includes(searchTerm.toLowerCase()))
                        .map((tx, idx) => (
                        <tr key={idx} className="hover:bg-slate-800/30">
                          <td className="py-3 font-mono text-xs text-amber-400">{tx.id}</td>
                          <td className="py-3 text-slate-300 text-xs">{tx.date}</td>
                          <td className="py-3 text-slate-200">{tx.desc}</td>
                          <td className="py-3"><span className="text-xs bg-green-500/10 text-green-400 px-2 py-0.5 rounded font-bold">{tx.status}</span></td>
                          <td className="py-3 text-right font-bold text-green-400">+{formatMoney(tx.amount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* PAGE 6: FAQ & POLICY */}
          {activeTab === 'faq' && (
            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-6">
              <h2 className="text-2xl font-bold text-amber-400">Frequently Asked Questions & Lock-in Policy</h2>
              
              <div className="space-y-4 text-sm">
                <div className="border border-slate-800 p-4 rounded-xl">
                  <h3 className="font-bold text-white mb-1">Q1. When can I withdraw my time deposit?</h3>
                  <p className="text-slate-400">The scheduled maturity date for both accounts is exactly June 30, 2030.</p>
                </div>
                <div className="border border-slate-800 p-4 rounded-xl">
                  <h3 className="font-bold text-white mb-1">Q2. Can I withdraw my money before June 30, 2030?</h3>
                  <p className="text-slate-400">Early withdrawal is disabled under the configured account terms. Please consult the actual agreement.</p>
                </div>
                <div className="border border-slate-800 p-4 rounded-xl">
                  <h3 className="font-bold text-white mb-1">Q3. Why is my account locked?</h3>
                  <p className="text-slate-400">The account is configured with a fixed maturity date. Principal access is restricted until maturity.</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
